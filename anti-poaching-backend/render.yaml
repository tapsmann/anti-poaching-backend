services:
  - type: web
    name: anti-poaching-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REGION
        value: zimbabwe
      - key: CORS_ORIGINS
        value: https://anti-poaching-frontend.onrender.com
